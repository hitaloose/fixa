name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            domain:
              - 'src/domain/**'
      - if: steps.changes.outputs.domain == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changes.outputs.domain == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.changes.outputs.domain == 'true'
        run: pnpm install --frozen-lockfile && pnpm test:mutation

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Visual baselines are committed per platform (darwin today); until a Linux baseline is
      # committed, CI skips only the screenshot comparison, not the rest of the visual test.
      - run: pnpm test:e2e --ignore-snapshots
